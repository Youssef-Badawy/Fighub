name: Flutter checks

on:
  pull_request:
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"
  push:
    branches:
      - main
      - fix/unified-buyer-seller-chats
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"

concurrency:
  group: flutter-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Firestore indexes JSON
        run: python -m json.tool firestore.indexes.json > /dev/null

      - name: Check Firestore rules compile with emulator
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-fighub "echo Firestore rules loaded"

      - name: Check Cloudflare worker JavaScript syntax
        run: node --input-type=module --check < backend/worker.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/main.dart lib/settings_page.dart lib/chat_service.dart lib/chat_page.dart lib/auth_profile_header.dart lib/offer_service.dart lib/product_service.dart lib/cloudinary_service.dart lib/worker_push_service.dart

      - name: Analyze entire Flutter app
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fighub-debug-apk-${{ github.sha }}
          path: fighub/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
