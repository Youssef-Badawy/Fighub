name: Flutter checks

on:
  pull_request:
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"
  push:
    branches:
      - main
      - "fix/unified-buyer-seller-chats"
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/chat_service.dart

      - name: Analyze changed service
        run: flutter analyze lib/chat_service.dart

      - name: Build debug APK
        run: flutter build apk --debug
