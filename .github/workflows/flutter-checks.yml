name: Flutter checks

on:
  pull_request:
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"
  push:
    branches:
      - main
      - "fix/unified-buyer-seller-chats"
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Firestore indexes JSON
        run: python -m json.tool firestore.indexes.json > /dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check changed service formatting
        run: dart format --output=none --set-exit-if-changed lib/chat_service.dart lib/offer_service.dart

      - name: Analyze entire Flutter app
        run: flutter analyze
