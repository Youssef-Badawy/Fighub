name: Flutter checks

on:
  pull_request:
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"
  push:
    branches:
      - main
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"

concurrency:
  group: flutter-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Firestore indexes JSON
        run: python -m json.tool firestore.indexes.json > /dev/null

      - name: Check Firestore rules compile with emulator
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-fighub "echo Firestore rules loaded"

      - name: Check Cloudflare worker JavaScript syntax
        run: node --input-type=module --check < backend/worker.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inspect formatted sold-item method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("lib/chat_service.dart").read_text()
          start = source.index("  Future<void> markOfferItemSold({")
          end = source.index("  Future<void> finalizeSettlement(", start)
          Path("/tmp/sold_item_method.dart").write_text(source[start:end])
          PY
          dart format /tmp/sold_item_method.dart
          cat /tmp/sold_item_method.dart

      - name: Check chat service formatting
        run: dart format --output=none --set-exit-if-changed lib/chat_service.dart

      - name: Analyze entire Flutter app
        run: flutter analyze
