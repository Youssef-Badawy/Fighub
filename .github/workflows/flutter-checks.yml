name: Flutter checks

on:
  pull_request:
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"
  push:
    branches:
      - main
      - fix/unified-buyer-seller-chats
      - feature/3d-printing-marketplace-and-fixes
      - fix/prebuild-stability-audit
    paths:
      - "fighub/**"
      - ".github/workflows/flutter-checks.yml"

# Keep only the latest validation run for each PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fighub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Firestore indexes JSON
        run: python -m json.tool firestore.indexes.json > /dev/null

      - name: Install Firestore rules test dependencies
        run: npm install --prefix rules-tests --no-audit --no-fund

      - name: Test Firestore rules with emulator
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-fighub-rules-test "npm --prefix rules-tests test"

      - name: Check Cloudflare worker JavaScript syntax
        run: node --input-type=module --check < backend/worker.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/main.dart lib/search_service.dart lib/settings_page.dart lib/chat_service.dart lib/chat_page.dart lib/auth_profile_header.dart lib/offer_service.dart lib/product_service.dart lib/cloudinary_service.dart lib/offer_manager_page.dart lib/worker_push_service.dart lib/chat_list_page.dart lib/print_marketplace_page.dart lib/seller_dashboard_page.dart lib/fighub_image_picker.dart lib/seller_rating_service.dart lib/seller_profile_service.dart lib/verification_service.dart lib/seller_profile_page.dart lib/auth_profile_header.dart lib/auth_manager.dart lib/verification_page.dart lib/profile_page.dart lib/add_product_page.dart lib/create_offer_page.dart lib/add_offer_item_page.dart lib/product_search_page.dart lib/product_model.dart lib/auth_manager.dart lib/seller_profile_service.dart test/search_service_test.dart test/product_search_page_test.dart test/product_model_test.dart

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze entire Flutter app
        run: flutter analyze --no-fatal-infos

